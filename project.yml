name: Zetesis
options:
  bundleIdPrefix: com.tsevis
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Zetesis:
    type: application
    platform: macOS
    sources:
      - path: Zetesis
      # The indexing engine (Python), copied whole into Resources/Engine.
      - path: Engine
        type: folder
        buildPhase: resources
        excludes: ["__pycache__", "**/__pycache__"]
    dependencies:
      # Text recognition for scanned books, run by the engine; lands in Contents/MacOS.
      - target: zetesis-ocr
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: Zetesis
        PRODUCT_BUNDLE_IDENTIFIER: com.tsevis.zetesis
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zetesis
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Charis Tsevis"
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "Zetesis reads the books of your library from the external disk."
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "6"
        DEVELOPMENT_LANGUAGE: en
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
  zetesis-ocr:
    type: tool
    platform: macOS
    sources: [OCRTool]
    settings:
      base:
        PRODUCT_NAME: zetesis-ocr
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  ZetesisTests:
    type: bundle.unit-test
    platform: macOS
    # Hostless: the model sources are compiled into the bundle so a test run never opens a window.
    sources: [ZetesisTests, Zetesis/Model]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Zetesis:
    build:
      targets:
        Zetesis: all
        ZetesisTests: [test]
    test:
      targets: [ZetesisTests]
